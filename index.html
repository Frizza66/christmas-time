<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Avvento - Menu Principale</title>
    <style>
        /* Stili per rendere la pagina chiara, leggibile e festosa */
        body {
            font-family: 'Verdana', 'Arial', sans-serif; /* Font ad alta leggibilità */
            background-color: #fffdf5; /* Sfondo caldo e riposante per gli occhi */
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #c62828;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .emojis {
            font-size: 2em;
            margin-bottom: 20px;
            letter-spacing: 10px;
        }
        .subtitle {
            font-size: 1.4em;
            color: #2e7d32;
            margin-bottom: 40px;
            font-weight: bold;
        }
        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Stile dei pulsanti */
        .btn-avvento {
            display: inline-block;
            padding: 20px 40px;
            background-color: #d32f2f; /* Rosso natalizio */
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.4em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            min-width: 220px;
        }
        /* Effetto quando si passa il mouse o si seleziona col tastiera */
        .btn-avvento:hover, .btn-avvento:focus {
            background-color: #b71c1c;
            transform: scale(1.05);
            outline: 4px solid #ffca28; /* Bordo giallo per feedback visivo chiaro */
        }
        /* Colori alternati per aiutare a distinguere i vari giorni */
        .btn-verde { background-color: #2e7d32; }
        .btn-verde:hover, .btn-verde:focus { background-color: #1b5e20; }
        
        .btn-blu { background-color: #1565c0; }
        .btn-blu:hover, .btn-blu:focus { background-color: #0d47a1; }
    </style>
</head>
<body>

    <h1>🎄 Christmas Time 🎄</h1>
    <div class="emojis">🎁 ⭐ 🔔 🦌 ❄️</div>
    <p class="subtitle">🎅 Buon Avvento!</p>

    <div class="menu-container">
        
        <!-- ========================================== -->
        <!-- ISTRUZIONI: Modifica i nomi dei file qui sotto -->
        <!-- ========================================== -->

        <!-- 1 -->
        <a href="adevent-english-third-class.html" class="btn-avvento">🎁 Advent Calendar for the third class</a>

        <!-- 2 -->
        <a href="avvento-classe-terza.html" class="btn-avvento btn-verde">🎁 Calendario dell’Avvento per la classe terza</a>

        <!-- 3 -->
        <a href="calendario-avvento.html" class="btn-avvento btn-blu">🎁 Calendario d’Avvento</a>

        <!-- 4 -->
        <a href="avvento-motivazionale.html" class="btn-avvento btn-blu">🎁 Calendario d’Avvento 2</a>

        <!-- 5 -->
        <a href="advent-calendar-first.html" class="btn-avvento btn-blu">🎁 Advent Calendar for the first class</a>

        <!-- 6 -->
        <a href="escape-lanterna.html" class="btn-avvento btn-blu">🎁 La lanterna di Natale (escape room)</a>

    </div>

</body>
</html>
