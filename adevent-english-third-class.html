<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tree of New Beginnings</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--ink:#17301f;--card:#ffffff;--muted:#4d6455;--tree:#1d5530;--tree-edge:#2f7a47;--trunk:#4c2c14;--accent:#b32b3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c26;--ink:#eaf3ec;--card:#1b2c38;--muted:#a9c0b0;--tree:#1d5530;--tree-edge:#4aa66a;--trunk:#6a4222}}
:root[data-theme="dark"]{--bg:#101c26;--ink:#eaf3ec;--card:#1b2c38;--muted:#a9c0b0;--tree:#1d5530;--tree-edge:#4aa66a;--trunk:#6a4222}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
header{text-align:center;padding:20px 16px 0;max-width:640px}
h1{font-family:'Lilita One',Georgia,sans-serif;font-weight:400;font-size:clamp(1.7rem,5vw,2.6rem);margin:0;letter-spacing:.01em}
header p{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
main{width:100%;max-width:820px;padding:8px 12px 28px}
svg{width:100%;height:auto;display:block;max-height:80vh}
.tree{fill:#2fa04d;stroke:#6fdc84;stroke-width:7;stroke-linejoin:round}
.wire{fill:none;stroke:#0e3d1b;stroke-width:3;stroke-linecap:round}
.bulb{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.bulb{animation:none}}
.trunk{fill:var(--trunk)}
.knob{fill:#6fdc84}
.b{cursor:pointer;outline:none;transition:transform .18s}
.b .ball{transform-box:fill-box;transform-origin:center;transition:transform .18s}
.b:hover .ball,.b:focus-visible .ball{transform:scale(1.12)}
.b:focus-visible .ring{stroke:var(--accent);stroke-width:6;opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:5;opacity:0}
.b .ball.sway{transform-origin:50% 0;animation:sway 1.6s ease-out}
@keyframes sway{0%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(11deg)}55%{transform:rotate(-7deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}
#snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:6}
.flake{position:absolute;top:0;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(80,130,175,.9);animation:fall linear forwards}
@keyframes fall{0%{transform:translate3d(0,-6vh,0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--dx),108vh,0);opacity:.9}}
.b.seen .ball{opacity:.55}
.b.seen .ring{opacity:.9;stroke:#fff}
text{font-family:'Lilita One','Arial Black',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.count{text-align:center;color:var(--muted);font-weight:700;margin-top:2px}
#ov{position:fixed;inset:0;background:rgba(10,25,15,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.open{display:flex}
.card{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:22px;padding:26px 24px 20px;border-top:10px solid var(--c,#b32b3c);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.b .ball{transition:none}}
.num{font-family:'Lilita One',sans-serif;font-size:1.1rem;color:var(--c)}
.tag{display:inline-block;margin-left:8px;font-weight:700;color:var(--muted);font-size:.95rem}
.msg{font-size:clamp(1.3rem,4.6vw,1.65rem);line-height:1.4;font-weight:700;margin:12px 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
button:hover{background:var(--ink);color:var(--card)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.close{background:var(--ink);color:var(--card)}
</style>
</head>
<body>
<header>
  <h1>The Tree of New Beginnings</h1>
  <p>Tap a bauble to read your message. Close it and choose another one!</p>
</header>
<main>
  <svg viewBox="360 20 1240 1080" role="group" aria-label="Christmas tree with 25 numbered baubles">
    <defs id="defs"></defs>
    <path class="trunk" d="M884 960 L1060 960 L1100 1075 L848 1075 Z"/>
    <path class="tree" d="M984 55 C995 130 1050 225 1131 242 L1040 242 C1100 330 1150 380 1216 409 L1103 423 C1160 520 1260 600 1366 637 L1201 648 C1260 760 1400 840 1569 895 C1500 950 1250 975 980 975 C700 975 450 950 396 875 C560 850 700 780 796 651 L625 637 C760 590 850 520 884 426 L768 417 C860 370 920 300 936 242 L848 250 C920 220 975 150 984 55 Z"/>
    <g id="knobs"></g><g id="lights" pointer-events="none"></g>
    <circle cx="984" cy="52" r="18" fill="#b32b3c"/>
    <g id="balls"></g>
  </svg>
  <div class="count" id="count"></div>
</main>

<div id="snow" aria-hidden="true"></div>

<div id="ov" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="msg">
    <div><span class="num" id="n"></span><span class="tag" id="tag"></span></div>
    <p class="msg" id="msg" lang="en"></p>
    <div class="row">
      <button id="say">Listen</button>
      <button class="close" id="close">Close</button>
    </div>
  </div>
</div>

<script>
var COL={red:['#cf5a69','#a32233'],orange:['#eba861','#cd7d36'],yellow:['#f5d055','#d7a739'],green:['#98c785','#68a35a'],blue:['#73b8f0','#3d8bd0'],purple:['#8f66ae','#59388a']};
var T={S:'Choosing high school',F:'New friends',T:'New teachers',P:'Your strengths',E:'Last year and exam'};
// n, x, y, raggio, colore, categoria, frase
var D=[
[1,614,892,59,'red','S',"Choosing a new school is exciting. Trust yourself: you know what you like and what you are good at."],
[2,744,925,26,'orange','P',"You are curious, and curiosity is a superpower. Keep asking questions!"],
[3,864,906,41,'yellow','F',"New classmates are friends you have not met yet. Say hello with a big smile."],
[4,995,908,51,'green','T',"Your new teachers want you to succeed. Ask for help when you need it. It is a sign of courage, not weakness."],
[5,1139,896,58,'blue','E',"This is your last year in middle school. Make it a year you can be proud of."],
[6,1299,906,34,'purple','P',"Everyone is good at something. Think about what you do best and be proud of it."],
[7,1417,893,30,'yellow','S',"There is no perfect school, but there is a school that is perfect for you. Visit, listen and choose with your heart."],
[8,1229,785,46,'red','E',"Study a little every day. Small steps lead to big results."],
[9,1115,726,60,'blue','F',"Good friends laugh with you, help you and believe in you. Be that kind of friend too."],
[10,1003,814,24,'orange','P',"Your mistakes do not define you. What you learn from them does."],
[11,973,707,39,'red','T',"A good teacher opens a door, but you walk through it. Be ready for new ideas."],
[12,861,795,38,'orange','E',"Before the exam, take a deep breath. You have worked hard and you are more ready than you think."],
[13,742,810,45,'green','S',"Your future school will give you new chances. Dream big and imagine the person you want to become."],
[14,823,696,25,'blue','F',"Do not worry if you feel shy. Many students feel the same way on their first day."],
[15,926,635,37,'purple','P',"You are creative, strong and able to learn new things. Never forget it."],
[16,1084,562,52,'yellow','E',"Nobody is perfect in an exam. Do your best, and your best is always enough."],
[17,1178,585,24,'green','T',"Listen, ask questions and share your ideas. Teachers love students who try."],
[18,937,514,58,'orange','S',"Change can be scary, but it can also be wonderful. Every new beginning is a chance to grow."],
[19,833,597,39,'red','F',"You will keep your old friends and make new ones. Your heart has space for everyone."],
[20,949,385,50,'blue','P',"Your kindness is a real strength. It makes the world around you better."],
[21,1032,460,37,'purple','E',"Hard work is more important than talent. Keep trying every day."],
[22,1041,337,42,'green','T',"Remember the teachers who helped you here. Say thank you before you leave. Gratitude is powerful."],
[23,986,270,29,'orange','S',"Think about your goals. What do you want to learn? What makes you happy? Your answers will guide you."],
[24,981,206,24,'yellow','E',"You have grown so much in three years. Look how far you have come!"],
[25,986,157,24,'red','P',"Your adventure is just beginning. Be brave, be kind and believe in yourself!"]
];
var K=[[848,250],[936,242],[1040,242],[1131,242],[768,417],[884,426],[1103,423],[1216,409],[625,637],[796,651],[1201,648],[1366,637],[396,875],[1569,895]];
var NS='http://www.w3.org/2000/svg',cur=0,seen={};
try{seen=JSON.parse(localStorage.getItem('albero-seen')||'{}')}catch(e){seen={}}
var defs='';for(var k in COL)defs+='<linearGradient id="g-'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+COL[k][0]+'"/><stop offset="1" stop-color="'+COL[k][1]+'"/></linearGradient>';
document.getElementById('defs').innerHTML=defs;
document.getElementById('knobs').innerHTML=K.map(function(p){return '<circle class="knob" cx="'+p[0]+'" cy="'+p[1]+'" r="13"/>'}).join('');
var h='';
D.forEach(function(d,i){
  var n=d[0],x=d[1],y=d[2],r=d[3],c=d[4],hit=Math.max(r,26);
  h+='<g class="b'+(seen[n]?' seen':'')+'" data-i="'+i+'" tabindex="0" role="button" aria-label="Message number '+n+'">'+
   '<circle cx="'+x+'" cy="'+y+'" r="'+(hit+4)+'" fill="transparent"/>'+
   '<g class="ball"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#g-'+c+')"/>'+
   '<text x="'+x+'" y="'+(y+2)+'" font-size="'+Math.round(r*(n>9?.9:1.15))+'">'+n+'</text></g>'+
   '<circle class="ring" cx="'+x+'" cy="'+y+'" r="'+(r+7)+'"/></g>';
});
document.getElementById('balls').innerHTML=h;
function $(id){return document.getElementById(id)}
function count(){$('count').textContent='Messages read: '+Object.keys(seen).length+' of 25'}
function show(i){
  cur=(i+25)%25;var d=D[cur];
  $('n').textContent='Message '+d[0]+' of 25';$('tag').textContent=T[d[5]];
  $('msg').textContent=d[6];
  $('ov').querySelector('.card').style.setProperty('--c',COL[d[4]][1]);
  $('ov').classList.add('open');$('ov').setAttribute('aria-hidden','false');
  seen[d[0]]=1;try{localStorage.setItem('albero-seen',JSON.stringify(seen))}catch(e){}
  var el=document.querySelector('.b[data-i="'+cur+'"]');if(el)el.classList.add('seen');
  count();stop();$('close').focus();
}
function hide(){$('ov').classList.remove('open');$('ov').setAttribute('aria-hidden','true');stop();
  var el=document.querySelector('.b[data-i="'+cur+'"]');if(el)el.focus()}
function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}
document.querySelectorAll('.b').forEach(function(b){
  b.addEventListener('click',function(){pick(b)});
  b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b)}});
});
var ac=null,busy=false,calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function chime(){try{
  var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  ac=ac||new A();if(ac.state==='suspended')ac.resume();
  var t=ac.currentTime;
  [1318.5,1760,2093].forEach(function(f,k){
    var o=ac.createOscillator(),g=ac.createGain(),s=t+k*.09;
    o.type='sine';o.frequency.value=f*(1+Math.random()*.01);
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.07,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+1.2);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+1.3);
  });
}catch(e){}}
function snow(){
  if(calm)return;
  var box=$('snow');
  for(var i=0;i<70;i++){
    var f=document.createElement('span'),z=3+Math.random()*7;
    f.className='flake';
    f.style.cssText='left:'+(Math.random()*100)+'vw;width:'+z+'px;height:'+z+'px;--dx:'+((Math.random()-.5)*14)+'vw;animation-duration:'+(4+Math.random()*3.5)+'s;animation-delay:'+(Math.random()*1.6)+'s';
    f.addEventListener('animationend',function(){this.remove()});
    box.appendChild(f);
  }
}
function pick(b){
  if(busy)return;busy=true;
  var ball=b.querySelector('.ball');
  if(!calm){ball.classList.remove('sway');void ball.getBoundingClientRect();ball.classList.add('sway');
    ball.addEventListener('animationend',function(){ball.classList.remove('sway')},{once:true});}
  chime();snow();
  setTimeout(function(){busy=false;show(+b.dataset.i)},calm?0:750);
}
$('close').onclick=hide;
$('ov').addEventListener('click',function(e){if(e.target===this)hide()});
document.addEventListener('keydown',function(e){
  if(!$('ov').classList.contains('open'))return;
  if(e.key==='Escape')hide();
});
$('say').onclick=function(){
  if(!window.speechSynthesis){return}
  stop();var u=new SpeechSynthesisUtterance(D[cur][6]);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u);
};
var lt=$('lights');
lt.innerHTML=['M440 868 Q700 950 984 925 Q1270 900 1520 885','M650 645 Q880 735 1100 690 Q1250 655 1340 640','M880 432 Q990 475 1100 430','M938 248 Q990 292 1040 248'].map(function(d){return '<path class="wire" d="'+d+'"/>'}).join('');
var LC=['#ffe066','#ff6b6b','#7fd8ff','#ffffff','#ffb347'],jj=0;
Array.prototype.slice.call(lt.querySelectorAll('path')).forEach(function(p){
  var L=p.getTotalLength();
  for(var s=30;s<L-10;s+=64){var q=p.getPointAtLength(s),c=LC[jj%5];
    lt.insertAdjacentHTML('beforeend','<g class="bulb" style="animation-delay:'+((jj%5)*.5)+'s"><circle cx="'+q.x+'" cy="'+q.y+'" r="15" fill="'+c+'" opacity=".3"/><circle cx="'+q.x+'" cy="'+q.y+'" r="7" fill="'+c+'" stroke="#0e3d1b" stroke-width="1.5"/></g>');jj++;}
});
count();
</script>
</body>
</html>
